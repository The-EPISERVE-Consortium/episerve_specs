name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: The examples pass the CLI
        run: episerve-validate src/episerve_specs/specs/*/examples/*.json

  action:
    # Runs this repository's own action, the way a model repository uses it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: src/episerve_specs/specs/model_card/examples/model__prediction__generic__timesfm.json
